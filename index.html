<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Hello, Name</title>
</head>
<body>
  <h1>Hello App</h1>

  <!-- The input view: shown when no name is stored yet -->
  <div id="askView"> 
    <label for="nameInput">What is your name?</label><br>
    <input type="text" id="nameInput" placeholder="Enter your name"><br>
    <label for="colorInput">Favorite color?</label><br>
    <input type="text" id="colorInput" placeholder="">
    <button id="saveBtn">Save</button>
  </div>

  <!-- The greeting view: shown when a name IS stored -->
  <div id="greetView" class="hidden">
    <div id="greeting"></div>
    <div id="color"></div>
    <p id="modtime"></p>
    <button id="forgetBtn">Forget me</button>
    <button id="newColorBtn">New color</button>
  </div>

    <!-- Update banner: hidden until a new SW is waiting -->
  <div id="updateBanner" class="hidden">
    <span>A new version is available.</span>
    <button id="refreshBtn" type="button">Refresh</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
